---
services:
  freqtrade:
    build:
      context: .
      dockerfile: "./docker/Dockerfile.custom"
    image: freqtradeorg/freqtrade:custom
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "/data/freqtrade/user_data:/freqtrade/user_data"
    # Port 8088 mapping vào 8080 (tránh xung đột với coolify-proxy đang dùng 8080)
    ports:
      - "8088:8080"
    # Lệnh khởi chạy bot tự động tải StrategyMTFSniper
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy-path /freqtrade/strategies/active
      --strategy StrategyMTFSniper
