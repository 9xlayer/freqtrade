---
services:
  freqtrade:
    build:
      context: .
      dockerfile: "./docker/Dockerfile.custom"
    image: freqtradeorg/freqtrade:custom
    restart: unless-stopped
    container_name: freqtrade
    environment:
      - PYTHONPATH=/freqtrade
      - JEV_API_KEY=${JEV_API_KEY}
      - JEV_API_URL=${JEV_API_URL:-https://api.typesafe.ai/v1/systemone}
      - JEV_MODE=${JEV_MODE:-external}
      - MTF_RUNTIME_MODE=${MTF_RUNTIME_MODE:-decision_external}
      - JEV_FAIL_POLICY=${JEV_FAIL_POLICY:-fallback_native}
      - JEV_CONFIRM_THRESHOLD=${JEV_CONFIRM_THRESHOLD:-0.70}
      - JEV_DECISION_WEIGHT_AI=${JEV_DECISION_WEIGHT_AI:-0.10}
      - JEV_DECISION_CHOPPY_PENALTY=${JEV_DECISION_CHOPPY_PENALTY:-0.05}
      - JEV_1W_BEAR_PENALTY=${JEV_1W_BEAR_PENALTY:-0.35}
      - JEV_API_TIMEOUT=${JEV_API_TIMEOUT:-4}
      - JEV_HUNTER_MODEL_VERSION=${JEV_HUNTER_MODEL_VERSION:-jev-latest}
      - JEV_HUNTER_MISSING_MODEL_POLICY=${JEV_HUNTER_MISSING_MODEL_POLICY:-no_cache}
      - JEV_DECISION_MODEL_VERSION=${JEV_DECISION_MODEL_VERSION:-jev-latest}
      - ENABLE_JEV_DECISION=${ENABLE_JEV_DECISION:-true}
      - ENABLE_JEV_HUNTER=${ENABLE_JEV_HUNTER:-false}
      - ENABLE_HUNTER_LONG=${ENABLE_HUNTER_LONG:-false}
      - ENABLE_WATERFALL=${ENABLE_WATERFALL:-true}
      - ENABLE_DYNAMIC_SIZING=${ENABLE_DYNAMIC_SIZING:-true}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://192.168.68.100:40002}
      - HTTP_PROXY=${HTTP_PROXY:-http://192.168.68.100:40002}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,binance.com,api.binance.com,fapi.binance.com,typesafe.ai,api.typesafe.ai,telegram.org,api.telegram.org}
    volumes:
      # Persistent data only — strategies come from the image build
      - "/data/freqtrade/user_data:/freqtrade/user_data"
    # Host 8088 → container 8080 (avoid clash with coolify-proxy on 8080)
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Overlay config wins over stale strategy_path in mounted config.json
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --config /freqtrade/config.mtf_sniper.json
      --strategy-path /freqtrade/strategies/mtf_sniper
      --strategy StrategyMTFSniper
